name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build
        run: lake build callclaude clidemo ask chat formalize compare review tests
      - name: Test
        run: lake test
      # The file lean-toolchain names the lowest supported toolchain. This
      # step repeats the build and the tests under the newest one.
      - name: Build and test under the newest supported toolchain
        run: |
          echo "leanprover/lean4:v4.36.0" > lean-toolchain
          lake build callclaude clidemo ask chat formalize compare review tests
          lake test

  # Linux is not a tested platform yet. This job reports the state of the
  # Linux build without failing the workflow.
  linux:
    name: Linux (not yet supported)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install the libcurl headers
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build
        run: lake build callclaude clidemo ask chat formalize compare review tests
      - name: Test
        run: lake test
